      toAddress. With a non-empty toAddress the matching requests are
      sorted newest first (descending registration momentum height; the
      comparator has no tie-break, so requests registered at the same
      height appear in unspecified order). An empty toAddress matches every
      request but skips the sort, leaving the storage-key order of
      getAllUnwrapTokenRequests. count is the number of matching requests.
      Like getAllUnwrapTokenRequests, the whole call fails if any request
      on the page references a token pair that has been removed from its
      network's configuration.
    params:
      - name: toAddress
        required: true
        schema:
          type: string
        description: >-
          NoM beneficiary address; empty matches every request (in
          storage-key order).
      - name: pageIndex
        required: true
        schema:
          $ref: "#/components/schemas/PageIndex"
        description: 0-based page number.
      - name: pageSize
        required: true
        schema:
          $ref: "#/components/schemas/PageSize"
        description: Number of requests per page.
    result:
      name: unwrapTokenRequestList
      schema:
        $ref: "#/components/schemas/BridgeUnwrapTokenRequestList"
      description: >-
        One page of matching unwrap requests; count is the number of
        matching requests.
    examples:
      - name: getAllUnwrapTokenRequestsByToAddress
