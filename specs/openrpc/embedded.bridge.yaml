      toAddress, newest first. The comparison is an exact string match and
      requests store the destination lowercased, so a mixed-case toAddress
      matches nothing; an empty toAddress matches every request. count is
      the number of matching requests.
    params:
      - name: toAddress
        required: true
        schema:
          type: string
        description: >-
