  - name: embedded.bridge.getUnwrapTokenRequestByHashAndLog
    summary: Returns the unwrap request for a source transaction hash and log index.
    description: >-
      Returns the unwrap request registered for the given deposit
      transaction hash and event log index on the source network,
      augmented with its ZTS token info and the momentums left until it
      can be redeemed. It produces an error for an unknown request, and
      also when the request's token pair has been removed from the
      network's configuration, since the redeem delay can no longer be
      computed.
    params:
      - name: transactionHash
        required: true
        schema:
          $ref: "#/components/schemas/Hash"
        description: Transaction hash of the deposit event on the source network.
      - name: logIndex
        required: true
        schema:
          type: integer
          minimum: 0
        description: Event log index of the deposit on the source network.
