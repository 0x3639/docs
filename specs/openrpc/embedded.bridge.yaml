          matches every request.
      - name: pageIndex
        required: true
        schema:
          $ref: "#/components/schemas/PageIndex"
        description: 0-based page number.
      - name: pageSize
        required: true
        schema:
          $ref: "#/components/schemas/PageSize"
        description: Number of requests per page.
    result:
      name: wrapTokenRequestList
      schema:
        $ref: "#/components/schemas/BridgeWrapTokenRequestList"
      description: >-
        One page of matching wrap requests, newest first; count is the
        number of matching requests.
    examples:
      - name: getAllWrapTokenRequestsByToAddress
        params:
          - name: toAddress
            value: "0xe85f1548d9dabecbda6ce46926f209a9203846dd"
          - name: pageIndex
            value: 0
          - name: pageSize
            value: 2
