  - name: embedded.bridge.getFeeTokenPair
    summary: Returns the wrap fees the bridge has accumulated for a ZTS token.
    description: >-
      Returns the wrap fees the bridge has accumulated for the given ZTS
      token, in that token's smallest units, at the frontier momentum. A
      token with no recorded fees yields an accumulated fee of "0", not an
      error.
    params:
      - name: tokenStandard
        required: true
        schema:
          $ref: "#/components/schemas/TokenStandard"
        description: The ZTS token whose accumulated fees to query.
    result:
      name: feeTokenPair
      schema:
        $ref: "#/components/schemas/BridgeZtsFeesInfo"
      description: The token and its accumulated wrap fee.
    examples:
      - name: getFeeTokenPair
        params:
          - name: tokenStandard
            value: "zts1znnxxxxxxxxxxxxx9z4ulx"
        result:
          name: feeTokenPair
          value: {"tokenStandard":"zts1znnxxxxxxxxxxxxx9z4ulx","accumulatedFee":"11201051223740"}

