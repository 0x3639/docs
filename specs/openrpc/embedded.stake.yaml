# OpenRPC fragments for the "embedded.stake" JSON-RPC namespace.
#
# Source of truth: godoc comments and signatures of StakeApi in the pinned
# go-zenon source (.build/go-zenon/rpc/api/embedded/stake.go, shared.go) and
# wire struct json tags in vm/embedded/definition (stake.go StakeInfo,
# common.go RewardDeposit). The namespace reads the state of the stake
# embedded contract (active stake entries and the QSR rewards they earn) as
# of the frontier momentum. A stake locks at least 1 ZNN for a duration that
# is a multiple of 30 days, between 30 and 360 days; it can be cancelled only
# after expiration, which returns the ZNN and marks the entry revoked.
# Staking rewards are paid only in QSR, so the ZNN side of every reward
# amount stays 0. Epochs are consecutive 24-hour windows counted from the
# genesis timestamp, starting at epoch 0; token amounts are expressed in the
# smallest unit (10^8 per ZNN or QSR) with big.Int values rendered as base-10
# JSON strings. Every exported method is served as embedded.stake.<method>.
#
# The reward wire types (RewardHistoryList, RewardHistoryEntry,
# RewardDeposit) are shared across the pillar, stake and sentinel namespaces
# and are defined once in the pillar fragment; this fragment reuses them by
# $ref and defines only the stake-specific entry/list types (StakeEntry,
# StakeList).
#
# Examples were captured live from a public mainnet node
# (https://my.hc1node.com:35997) on 2026-06-13; no example values are
# invented. List examples were requested with small page sizes to stay
# readable.
schemas:
  StakeEntry:
    type: object
    description: >-
      One active stake as reported by embedded.stake.getEntriesByAddress.
      The stake can be cancelled once expirationTimestamp has passed, which
      returns the locked ZNN and removes the entry.
    properties:
      amount:
        $ref: "#/components/schemas/Amount"
        description: The locked ZNN, in the smallest unit (10^8 per ZNN), as a base-10 string.
      weightedAmount:
        $ref: "#/components/schemas/Amount"
        description: >-
          The duration-weighted amount the QSR rewards are computed from, in
          smallest units, as a base-10 string: amount times
          (9 + duration in 30-day units) / 10, so a 30-day stake weighs 1x
          and each additional 30-day unit adds 0.1x, up to 2.1x at 360 days.
      startTimestamp:
        type: integer
        description: Unix seconds at which the stake was created.
      expirationTimestamp:
        type: integer
        description: >-
          Unix seconds at which the stake expires; the entry can be
          cancelled only once this has passed.
      address:
        $ref: "#/components/schemas/Address"
        description: The staking (owner) address.
      id:
        $ref: "#/components/schemas/Hash"
        description: >-
          Entry id: the hash of the send block that created the stake, and
          the handle passed to the contract's Cancel method.
    required: [amount, weightedAmount, startTimestamp, expirationTimestamp, address, id]

  StakeList:
    type: object
    description: >-
      One page of an address's active stake entries, returned by
      embedded.stake.getEntriesByAddress. count, totalAmount and
      totalWeightedAmount cover all of the address's active entries, not
      just the page.
    properties:
      totalAmount:
        $ref: "#/components/schemas/Amount"
        description: >-
          Total locked ZNN summed over all of the address's active entries,
          in smallest units, as a base-10 string.
      totalWeightedAmount:
        $ref: "#/components/schemas/Amount"
        description: >-
          Total duration-weighted amount summed over all of the address's
          active entries, in smallest units, as a base-10 string.
      count:
        type: integer
        minimum: 0
        description: Total number of the address's active stake entries.
      list:
        type: array
        description: >-
          The page of active entries, sorted by ascending expiration time
          (soonest expiring first) with ties broken by ascending entry id.
        items:
          $ref: "#/components/schemas/StakeEntry"
    required: [totalAmount, totalWeightedAmount, count, list]

methods:
  - name: embedded.stake.getEntriesByAddress
    summary: Returns one page of the active stake entries of an address.
    description: >-
      Returns one page of the active (not yet cancelled) stake entries of
      address, read from contract state at the frontier momentum and sorted
      by ascending expiration time, soonest expiring first, with ties broken
      by ascending entry id. count, totalAmount and totalWeightedAmount in
      the result cover all of the address's active entries, not just the
      page. A pageSize above 1024 is rejected with
      api.ErrPageSizeParamTooBig.
    params:
      - name: address
        required: true
        schema:
          $ref: "#/components/schemas/Address"
        description: Staking (owner) address whose active entries to list.
      - name: pageIndex
        required: true
        schema:
          $ref: "#/components/schemas/PageIndex"
        description: 0-based page number.
      - name: pageSize
        required: true
        schema:
          $ref: "#/components/schemas/PageSize"
        description: Number of entries per page; must be at most 1024.
    result:
      name: stakeList
      schema:
        $ref: "#/components/schemas/StakeList"
      description: >-
        One page of the address's active stake entries; count and the two
        totals cover all active entries, not just the page.
    examples:
      - name: stakeEntriesForAddress
        params:
          - name: address
            value: "z1qqzxdde250xl6sc9nv9anxt4r6kap8jyne7xgd"
          - name: pageIndex
            value: 0
          - name: pageSize
            value: 5
        result:
          name: stakeList
          value: {"totalAmount":"3709189117316","totalWeightedAmount":"7789297146363","count":2,"list":[{"amount":"3708940428190","weightedAmount":"7788774899199","startTimestamp":1766255250,"expirationTimestamp":1797359250,"address":"z1qqzxdde250xl6sc9nv9anxt4r6kap8jyne7xgd","id":"6de212372aa14fd54093b63887db39165f1358d8c031a9160543684d1a0d80f1"},{"amount":"248689126","weightedAmount":"522247164","startTimestamp":1769282920,"expirationTimestamp":1800386920,"address":"z1qqzxdde250xl6sc9nv9anxt4r6kap8jyne7xgd","id":"3fb7c2bbc0cc5e7ad17346d83be9748c226730d1fac59b30e2c87467273e0491"}]}

  - name: embedded.stake.getUncollectedReward
    summary: Returns the staking rewards credited to an address but not yet collected.
    description: >-
      Returns the staking rewards credited to address but not yet collected,
      read from contract state at the frontier momentum. Staking rewards are
      paid in QSR, so the ZNN amount of the deposit stays 0; an address with
      nothing to collect yields a deposit with both amounts 0, not an error.
    params:
      - name: address
        required: true
        schema:
          $ref: "#/components/schemas/Address"
        description: Address whose uncollected staking rewards to query.
    result:
      name: rewardDeposit
      schema:
        $ref: "#/components/schemas/RewardDeposit"
      description: >-
        Uncollected reward; the ZNN amount is always 0 for staking and the
        QSR amount holds what is collectable (0 when nothing is).
    examples:
      - name: getUncollectedReward
        params:
          - name: address
            value: "z1qqzxdde250xl6sc9nv9anxt4r6kap8jyne7xgd"
        result:
          name: rewardDeposit
          value: {"address":"z1qqzxdde250xl6sc9nv9anxt4r6kap8jyne7xgd","znnAmount":"0","qsrAmount":"9978478488"}

  - name: embedded.stake.getFrontierRewardByPage
    summary: Pages over the per-epoch staking reward history of an address, newest epoch first.
    description: >-
      Pages over the per-epoch staking reward history of address, newest
      epoch first; epochs without a recorded reward yield zero-amount
      entries. Page 0 starts at the last epoch the contract has processed
      and each entry steps one epoch back; the page is cut short at epoch 0
      (when no epoch has been processed yet the list is empty). Staking
      rewards are paid in QSR, so the ZNN amount of each entry stays 0. A
      pageSize above 1024 is rejected with api.ErrPageSizeParamTooBig. In
      the result, count is the total number of epochs the contract has
      processed so far (last processed epoch + 1), not the number of entries
      in list.
    params:
      - name: address
        required: true
        schema:
          $ref: "#/components/schemas/Address"
        description: Address whose staking reward history to page over.
      - name: pageIndex
        required: true
        schema:
          $ref: "#/components/schemas/PageIndex"
        description: 0-based page number, counting backwards from the last processed epoch.
      - name: pageSize
        required: true
        schema:
          $ref: "#/components/schemas/PageSize"
        description: Number of epochs per page; must be at most 1024.
    result:
      name: rewardHistoryList
      schema:
        $ref: "#/components/schemas/RewardHistoryList"
      description: >-
        Reward entries in descending epoch order; count is the total number
        of processed epochs.
    examples:
      - name: getFrontierRewardByPage
        params:
          - name: address
            value: "z1qqzxdde250xl6sc9nv9anxt4r6kap8jyne7xgd"
          - name: pageIndex
            value: 0
          - name: pageSize
            value: 2
        result:
          name: rewardHistoryList
          value: {"count":1662,"list":[{"epoch":1661,"znnAmount":"0","qsrAmount":"9978478488"},{"epoch":1660,"znnAmount":"0","qsrAmount":"9978478488"}]}
