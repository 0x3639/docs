# OpenRPC fragments for the "embedded.sentinel" JSON-RPC namespace.
#
# Source of truth: godoc comments and signatures of SentinelApi in the
# pinned go-zenon source (.build/go-zenon/rpc/api/embedded/sentinel.go,
# shared.go) and wire struct json tags in vm/embedded/definition
# (SentinelInfo, RewardDeposit). The namespace reads the state of the
# sentinel embedded contract (registrations, deposits, rewards) as of
# the frontier momentum. A sentinel's lifetime cycles through a 27-day
# locked window followed by a 3-day revocable window; the revocation
# state (isRevocable, revokeCooldown) is computed from the registration
# timestamp against the frontier momentum timestamp, not stored. Epochs
# are consecutive 24-hour windows counted from the genesis timestamp,
# starting at epoch 0; token amounts are expressed in the smallest unit
# (10^8 per ZNN or QSR) with big.Int values rendered as base-10 JSON
# strings.
#
# Reward types (RewardHistoryList, RewardHistoryEntry, RewardDeposit)
# are shared across the reward-distributing embedded contracts and are
# reused by $ref rather than redefined here; only sentinel-specific
# types (SentinelInfo, SentinelInfoList) are defined inline.
#
# Examples were captured live from a public mainnet node
# (https://my.hc1node.com:35997) on 2026-06-13; no example values are
# invented. List examples were requested with small page sizes to stay
# readable.
schemas:
  SentinelInfo:
    type: object
    description: >-
      Describes one registered sentinel as reported by
      embedded.sentinel.getByOwner and embedded.sentinel.getAllActive.
      owner and registrationTimestamp come from contract state at the
      frontier momentum; active reports whether the sentinel's stored
      revoke timestamp is still 0. isRevocable and revokeCooldown are
      computed from the registration timestamp and the frontier momentum
      timestamp: a sentinel's lifetime cycles through a 27-day locked
      window followed by a 3-day revocable window.
    properties:
      owner:
        $ref: "#/components/schemas/Address"
        description: >-
          The address that registered the sentinel; each address can run
          at most one sentinel.
      registrationTimestamp:
        type: integer
        description: Unix seconds at which the sentinel was registered.
      isRevocable:
        type: boolean
        description: Whether the sentinel is currently in the 3-day revocable window.
      revokeCooldown:
        type: integer
        minimum: 0
        description: >-
          Seconds until the revocability state flips: until revocation
          opens while locked, until it closes while revocable.
      active:
        type: boolean
        description: >-
          Whether the sentinel is active (its stored revoke timestamp is
          still 0); false once it has been revoked.
    required: [owner, registrationTimestamp, isRevocable, revokeCooldown, active]

  SentinelInfoList:
    type: object
    description: >-
      One page of sentinels as returned by
      embedded.sentinel.getAllActive. count is the total number of active
      sentinels, not the number of entries in list.
    properties:
      count:
        type: integer
        minimum: 0
        description: Total number of active sentinels.
      list:
        type: array
        items:
          $ref: "#/components/schemas/SentinelInfo"

methods:
  - name: embedded.sentinel.getByOwner
    summary: Returns the sentinel registered by an address, active or revoked.
    description: >-
      Returns the sentinel registered by owner, whether active or
      revoked, read from contract state at the frontier momentum, or null
      without an error when the address has no sentinel.
    params:
      - name: owner
        required: true
        schema:
          $ref: "#/components/schemas/Address"
        description: Owner address whose sentinel to look up.
    result:
      name: sentinelInfo
      schema:
        oneOf:
          - $ref: "#/components/schemas/SentinelInfo"
          - type: "null"
      description: The sentinel, or null when the address has no sentinel.
    examples:
      - name: getByOwner
        params:
          - name: owner
            value: "z1qqzznwjskxekv9u5gy0hcxt67fnd6ulsh20c4h"
        result:
          name: sentinelInfo
          value: {"owner":"z1qqzznwjskxekv9u5gy0hcxt67fnd6ulsh20c4h","registrationTimestamp":1688554440,"isRevocable":false,"revokeCooldown":227050,"active":true}
      - name: getByOwnerNone
        params:
          - name: owner
            value: "z1qxemdeddedxsentynelxxxxxxxxxxxxxwy0r2r"
        result:
          name: sentinelInfo
          value: null

  - name: embedded.sentinel.getAllActive
    summary: Returns one page of the active sentinels.
    description: >-
      Returns one page of the active (non-revoked) sentinels, read from
      contract state at the frontier momentum in storage-key (owner
      address byte) order. Revoked sentinels are filtered out before
      pagination, so count is the total number of active sentinels, not
      the number of entries in list. A pageSize above 1024 is rejected
      with ErrPageSizeParamTooBig.
    params:
      - name: pageIndex
        required: true
        schema:
          $ref: "#/components/schemas/PageIndex"
        description: 0-based page number.
      - name: pageSize
        required: true
        schema:
          $ref: "#/components/schemas/PageSize"
        description: Number of sentinels per page; must be at most 1024.
    result:
      name: sentinelInfoList
      schema:
        $ref: "#/components/schemas/SentinelInfoList"
      description: >-
        One page of active sentinels in storage-key order; count is the
        total number of active sentinels.
    examples:
      - name: getAllActive
        params:
          - name: pageIndex
            value: 0
          - name: pageSize
            value: 5
        result:
          name: sentinelInfoList
          value: {"count":230,"list":[{"owner":"z1qqzznwjskxekv9u5gy0hcxt67fnd6ulsh20c4h","registrationTimestamp":1688554440,"isRevocable":false,"revokeCooldown":227060,"active":true},{"owner":"z1qqzstvtfr407fy25622zh6a2kplsd2vzu4c5hz","registrationTimestamp":1643218940,"isRevocable":false,"revokeCooldown":1547560,"active":true},{"owner":"z1qqzscwccvtaaa3ameqhgevnyuzmwksluu42k7q","registrationTimestamp":1643213900,"isRevocable":false,"revokeCooldown":1542520,"active":true},{"owner":"z1qqz642m6sk9qpa4896etljzv6phlspmx3ctkl6","registrationTimestamp":1643749420,"isRevocable":false,"revokeCooldown":2078040,"active":true},{"owner":"z1qqzllq4lymrr0nmr7znhl0mjktqrv809ej2eyc","registrationTimestamp":1739218840,"isRevocable":false,"revokeCooldown":1643460,"active":true}]}

  # === Shared reward/deposit RPCs ===

  - name: embedded.sentinel.getDepositedQsr
    summary: Returns the QSR an address has deposited toward a sentinel registration.
    description: >-
      Returns the QSR address has deposited in the sentinel contract
      toward a future sentinel registration, read from contract state at
      the frontier momentum. The amount is a base-10 string in smallest
      units; an address with no deposit yields "0".
    params:
      - name: address
        required: true
        schema:
          $ref: "#/components/schemas/Address"
        description: Address whose deposit to query.
    result:
      name: depositedQsr
      schema:
        $ref: "#/components/schemas/Amount"
      description: Deposited QSR in smallest units, as a base-10 string; "0" when no deposit exists.
    examples:
      - name: getDepositedQsr
        params:
          - name: address
            value: "z1qqzznwjskxekv9u5gy0hcxt67fnd6ulsh20c4h"
        result:
          name: depositedQsr
          value: "0"

  - name: embedded.sentinel.getUncollectedReward
    summary: Returns the sentinel rewards credited to an address but not yet collected.
    description: >-
      Returns the ZNN and QSR sentinel rewards credited to address but
      not yet collected, read from contract state at the frontier
      momentum. An address with nothing to collect yields a deposit with
      both amounts 0, not an error.
    params:
      - name: address
        required: true
        schema:
          $ref: "#/components/schemas/Address"
        description: Address whose uncollected rewards to query.
    result:
      name: rewardDeposit
      schema:
        $ref: "#/components/schemas/RewardDeposit"
      description: Uncollected ZNN and QSR amounts; both 0 when nothing is collectable.
    examples:
      - name: getUncollectedReward
        params:
          - name: address
            value: "z1qqzznwjskxekv9u5gy0hcxt67fnd6ulsh20c4h"
        result:
          name: rewardDeposit
          value: {"address":"z1qqzznwjskxekv9u5gy0hcxt67fnd6ulsh20c4h","znnAmount":"146659619542","qsrAmount":"326432557904"}

  - name: embedded.sentinel.getFrontierRewardByPage
    summary: Pages over the per-epoch sentinel reward history of an address, newest epoch first.
    description: >-
      Pages over the per-epoch sentinel reward history of address, newest
      epoch first; epochs without a recorded reward yield zero-amount
      entries. Page 0 starts at the last epoch the contract has processed
      and each entry steps one epoch back; the page is cut short at epoch
      0 (when no epoch has been processed yet the list is empty). A
      pageSize above 1024 is rejected with ErrPageSizeParamTooBig. In the
      result, count is the total number of epochs the contract has
      processed so far (last processed epoch + 1), not the number of
      entries in list.
    params:
      - name: address
        required: true
        schema:
          $ref: "#/components/schemas/Address"
        description: Address whose reward history to page over.
      - name: pageIndex
        required: true
        schema:
          $ref: "#/components/schemas/PageIndex"
        description: 0-based page number, counting backwards from the last processed epoch.
      - name: pageSize
        required: true
        schema:
          $ref: "#/components/schemas/PageSize"
        description: Number of epochs per page; must be at most 1024.
    result:
      name: rewardHistoryList
      schema:
        $ref: "#/components/schemas/RewardHistoryList"
      description: >-
        Reward entries in descending epoch order; count is the total
        number of processed epochs.
    examples:
      - name: getFrontierRewardByPage
        params:
          - name: address
            value: "z1qqzznwjskxekv9u5gy0hcxt67fnd6ulsh20c4h"
          - name: pageIndex
            value: 0
          - name: pageSize
            value: 2
        result:
          name: rewardHistoryList
          value: {"count":1662,"list":[{"epoch":1661,"znnAmount":"244173913","qsrAmount":"543478260"},{"epoch":1660,"znnAmount":"244173913","qsrAmount":"543478260"}]}
