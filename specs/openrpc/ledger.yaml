  - name: ledger.getMomentumBeforeTime
    summary: Returns the most recent momentum strictly before a Unix timestamp.
    description: >-
      Returns the most recent momentum whose timestamp is strictly before
      the given Unix timestamp (seconds). It returns null when no such
      momentum exists, i.e. when the genesis momentum's timestamp is at or
      after the given time.
    params:
      - name: timestamp
        required: true
        schema:
          type: integer
        description: Unix timestamp in seconds.
    result:
      name: momentum
      schema:
        oneOf:
          - $ref: "#/components/schemas/Momentum"
          - type: "null"
      description: >-
        The most recent momentum strictly before the given time, or null
        when no such momentum exists.
    examples:
      - name: momentumBeforeTime
        params:
          - name: timestamp
            value: 1781186060
        result:
          name: momentum
          value: {"version":1,"chainIdentifier":1,"hash":"2b9225c4d2ff1085fb15b528d8029e02a19b41513b85e0fe60704f8849c179e0","previousHash":"5d6d682f0f0ea4a88a0d60fdc38ed8f8424ef1679da8eae7de98b070ea44bbb6","height":13474917,"timestamp":1781186030,"data":"","content":[],"changesHash":"a7ffc6f8bf1ed76651c14756a061d662f580ff4de43b49fa82d80a4b80f8434a","publicKey":"dpJTNz+J+t+61CqNmqBCqN3jHhdiMbXqxAd6/eNlVmo=","signature":"xhU0Rnnf/gkTtdbacWaj38eoHyJgFpW29LvfNdZ4iLj3R5yZu6OXoGxZPg22r/qtr7xZWl34rerJ2QxK2Hr+AQ==","producer":"z1qzfq7urv5ykn9dnny9pe0z7dkssxqjn97wrv42"}

  - name: ledger.getMomentumByHash
    summary: Returns the momentum with the given hash.
