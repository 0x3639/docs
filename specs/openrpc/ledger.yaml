  - name: ledger.getMomentumsByHeight
    summary: Returns momentums starting at a given height, in ascending height order.
    description: >-
      Returns up to count momentums starting at the given momentum-chain
      height, in ascending height order. Heights past the frontier are
      skipped, so list may hold fewer than count entries.


      height must be at least 1 (the genesis momentum) or
      ErrHeightParamIsZero is returned; count is a maximum and must not
      exceed RpcMaxCountSize (1024) or ErrCountParamTooBig is returned. In
      the result, count is the current frontier momentum height, not the
      page length.
    params:
      - name: height
        required: true
        schema:
          type: integer
          minimum: 1
        description: Momentum-chain height to start from; must be at least 1.
      - name: count
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 1024
        description: Maximum number of momentums to return; must not exceed 1024.
    result:
      name: momentumList
      schema:
        $ref: "#/components/schemas/MomentumList"
      description: >-
        Momentums in ascending height order; count is the current frontier
        momentum height.
    examples:
      - name: momentumsByHeight
        params:
          - name: height
            value: 13474917
          - name: count
            value: 2
        result:
          name: momentumList
          value: {"list":[{"version":1,"chainIdentifier":1,"hash":"2b9225c4d2ff1085fb15b528d8029e02a19b41513b85e0fe60704f8849c179e0","previousHash":"5d6d682f0f0ea4a88a0d60fdc38ed8f8424ef1679da8eae7de98b070ea44bbb6","height":13474917,"timestamp":1781186030,"data":"","content":[],"changesHash":"a7ffc6f8bf1ed76651c14756a061d662f580ff4de43b49fa82d80a4b80f8434a","publicKey":"dpJTNz+J+t+61CqNmqBCqN3jHhdiMbXqxAd6/eNlVmo=","signature":"xhU0Rnnf/gkTtdbacWaj38eoHyJgFpW29LvfNdZ4iLj3R5yZu6OXoGxZPg22r/qtr7xZWl34rerJ2QxK2Hr+AQ==","producer":"z1qzfq7urv5ykn9dnny9pe0z7dkssxqjn97wrv42"},{"version":1,"chainIdentifier":1,"hash":"bce531e428758183f76fdf8916eecaf6f2db303939aa84f2fc82a587a5d65d92","previousHash":"2b9225c4d2ff1085fb15b528d8029e02a19b41513b85e0fe60704f8849c179e0","height":13474918,"timestamp":1781186060,"data":"","content":[{"address":"z1qq3zqckgywkwma0pafsq2cndl7anx23v099k79","hash":"476a08f66344d517771fd89b5895e5980f70e12c22c00f31fa6af37150d0850d","height":1666}],"changesHash":"40bd54b5ee832fbaa82f4b32ccd0d6cd215612515293c7f1878c2281bb3dc42d","publicKey":"i0MkFAj+f4FipCHu/L4Ee3g23pkRR7eoOPe1VRH2S4Y=","signature":"WkNtMLT6Jk9i5hvipZu0xmv2H5Bfcgymgz3N7Hqpx6eSVjRKNbBwBbXcLULTYw1tYofsHv1lboPfuPspOZ5pCw==","producer":"z1qr9dd6qmzwr8sazns24lna8zz5e8208nqq2hcx"}],"count":13474918}

  - name: ledger.getMomentumsByPage
    summary: Returns one page of the momentum chain, paginating backwards from the frontier.
    description: >-
      Returns one page of the momentum chain, paginating backwards from the
      frontier: pageIndex 0 holds the pageSize most recent momentums,
      pageIndex 1 the pageSize before those, and so on. Within a page,
      momentums are ordered by descending height (newest first).


      pageIndex is 0-based; pageSize must be at most RpcMaxPageSize (1024)
      or ErrPageSizeParamTooBig is returned. Pages that extend past the
      genesis momentum are truncated, and a page entirely before height 1
      yields an empty list. In the result, count is the current frontier
      momentum height.
    params:
      - name: pageIndex
        required: true
        schema:
          $ref: "#/components/schemas/PageIndex"
        description: 0-based page number, counting backwards from the frontier.
      - name: pageSize
        required: true
        schema:
          $ref: "#/components/schemas/PageSize"
        description: Number of momentums per page; must be at most 1024.
    result:
      name: momentumList
      schema:
        $ref: "#/components/schemas/MomentumList"
      description: >-
        Momentums in descending height order (newest first); count is the
        current frontier momentum height.
    examples:
      - name: momentumsByPage
        params:
          - name: pageIndex
            value: 0
          - name: pageSize
            value: 2
        result:
          name: momentumList
          value: {"list":[{"version":1,"chainIdentifier":1,"hash":"bce531e428758183f76fdf8916eecaf6f2db303939aa84f2fc82a587a5d65d92","previousHash":"2b9225c4d2ff1085fb15b528d8029e02a19b41513b85e0fe60704f8849c179e0","height":13474918,"timestamp":1781186060,"data":"","content":[{"address":"z1qq3zqckgywkwma0pafsq2cndl7anx23v099k79","hash":"476a08f66344d517771fd89b5895e5980f70e12c22c00f31fa6af37150d0850d","height":1666}],"changesHash":"40bd54b5ee832fbaa82f4b32ccd0d6cd215612515293c7f1878c2281bb3dc42d","publicKey":"i0MkFAj+f4FipCHu/L4Ee3g23pkRR7eoOPe1VRH2S4Y=","signature":"WkNtMLT6Jk9i5hvipZu0xmv2H5Bfcgymgz3N7Hqpx6eSVjRKNbBwBbXcLULTYw1tYofsHv1lboPfuPspOZ5pCw==","producer":"z1qr9dd6qmzwr8sazns24lna8zz5e8208nqq2hcx"},{"version":1,"chainIdentifier":1,"hash":"2b9225c4d2ff1085fb15b528d8029e02a19b41513b85e0fe60704f8849c179e0","previousHash":"5d6d682f0f0ea4a88a0d60fdc38ed8f8424ef1679da8eae7de98b070ea44bbb6","height":13474917,"timestamp":1781186030,"data":"","content":[],"changesHash":"a7ffc6f8bf1ed76651c14756a061d662f580ff4de43b49fa82d80a4b80f8434a","publicKey":"dpJTNz+J+t+61CqNmqBCqN3jHhdiMbXqxAd6/eNlVmo=","signature":"xhU0Rnnf/gkTtdbacWaj38eoHyJgFpW29LvfNdZ4iLj3R5yZu6OXoGxZPg22r/qtr7xZWl34rerJ2QxK2Hr+AQ==","producer":"z1qzfq7urv5ykn9dnny9pe0z7dkssxqjn97wrv42"}],"count":13474918}

  - name: ledger.getDetailedMomentumsByHeight
