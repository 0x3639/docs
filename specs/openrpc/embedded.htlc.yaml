# OpenRPC fragments for the "embedded.htlc" JSON-RPC namespace.
#
# Source of truth: godoc comments and signatures of HtlcApi in the pinned
# go-zenon source (.build/go-zenon/rpc/api/embedded/htlc.go) and the wire
# struct json tags in vm/embedded/definition/htlc.go (HtlcInfo via its
# HtlcInfoMarshal JSON form, and HtlcProxyUnlockInfo). The namespace reads
# hash time-locked contract (HTLC) state from the htlc embedded contract
# (z1qxemdeddedxhtlcxxxxxxxxxxxxxxxxxygecvw) as of the frontier momentum.
# An HTLC locks an amount of any ZTS token on behalf of a creator (the
# time-locked address) for a counterparty (the hash-locked address): the
# counterparty may claim the funds by revealing a preimage of the entry's
# hash lock before the expiration time, while the creator may reclaim them
# once the expiration time has been reached. Token amounts are big.Int
# values in the token's smallest units, rendered as base-10 JSON strings;
# the hash lock is a raw byte array rendered base64. Every exported method
# is served as embedded.htlc.<lowerCamelMethodName>.
#
# Examples were captured live from a public mainnet node
# (https://my.hc1node.com:35997) on 2026-06-13; no result values are
# invented. HTLC entries are deleted from contract state as soon as they
# are unlocked or reclaimed, and HTLCs are short-lived, so at capture time
# no active entry existed on mainnet: the getById example therefore shows
# the real "data non existent" error the node returns for a known
# (already-spent) id, accompanied by a request-only example that documents
# the call shape. The getProxyUnlockStatus example is live data.
schemas:
  HtlcInfo:
    type: object
    description: >-
      One stored hash time-locked contract entry, as returned by
      embedded.htlc.getById. The funds are held by the htlc embedded
      contract: the time-locked creator may reclaim them once the
      expiration time has been reached, and the hash-locked counterparty
      may unlock them before then by revealing a preimage whose digest
      matches the hash lock.
    properties:
      id:
        $ref: "#/components/schemas/Hash"
        description: >-
          Entry id: the hash of the send block that created the HTLC
          (the Create call). It is recovered from the storage key, not
          stored in the entry value.
      timeLocked:
        $ref: "#/components/schemas/Address"
        description: >-
          The creator's address, which funded the entry and may reclaim
          the funds once the expiration time has been reached.
      hashLocked:
        $ref: "#/components/schemas/Address"
        description: >-
          The counterparty's address, entitled to unlock the funds before
          expiration by revealing a valid preimage; the unlocked funds
          always go to this address.
      tokenStandard:
        $ref: "#/components/schemas/TokenStandard"
        description: ZTS identifier of the locked token.
      amount:
        $ref: "#/components/schemas/Amount"
        description: >-
          Locked amount in the token's smallest units, as a base-10
          string.
      expirationTime:
        type: integer
        description: >-
          Expiration time in Unix seconds. Strictly before it the
          hash-locked counterparty may unlock; once it is reached the
          time-locked creator may reclaim.
      hashType:
        type: integer
        description: >-
          Algorithm of the hash lock digest: 0 for SHA3-256, 1 for
          SHA-256. Both produce a 32-byte digest.
      keyMaxSize:
        type: integer
        minimum: 0
        description: Maximum accepted preimage length in bytes.
      hashLock:
        $ref: "#/components/schemas/Base64Bytes"
        description: >-
          The 32-byte hash lock digest the preimage must hash to (under
          hashType), base64 encoded.
    required:
      - id
      - timeLocked
      - hashLocked
      - tokenStandard
      - amount
      - expirationTime
      - hashType
      - keyMaxSize
      - hashLock

methods:
  - name: embedded.htlc.getById
    summary: Returns the active HTLC entry with the given id.
    description: >-
      Returns the hash time-locked contract entry whose id is the hash of
      the send block that created it, read from htlc contract state at the
      frontier momentum. The entry names the time-locked creator and the
      hash-locked counterparty, the locked token and amount, the
      expiration time, and the hash lock with its hash type and maximum
      preimage size. Entries are deleted from state as soon as they are
      unlocked or reclaimed, so an id that never existed or has already
      been spent yields the ErrDataNonExistent error ("data non existent",
      code -32000), not a null result.
    params:
      - name: id
        required: true
        schema:
          $ref: "#/components/schemas/Hash"
        description: >-
          The entry id: the hash of the send block that created the HTLC.
    result:
      name: htlcInfo
      schema:
        $ref: "#/components/schemas/HtlcInfo"
      description: >-
        The active HTLC entry; the call errors with ErrDataNonExistent
        when no active entry has that id.
    examples:
      - name: getByIdCallShape
        description: >-
          Request-only example documenting the call shape. No populated
          result is shown because no active HTLC existed on mainnet at
          capture time (entries are deleted on unlock or reclaim); see
          getByIdNonExistent for the node's actual response to a spent id.
        params:
          - name: id
            value: "294f81a20003c3d00880e9e03950f6b5dba6af8cd50da891a124b8819f011e81"
        result:
          name: htlcInfo
          value: null
      - name: getByIdNonExistent
        description: >-
          Live response for a known id whose HTLC was already unlocked or
          reclaimed: the node returns the ErrDataNonExistent error rather
          than a null result.
        params:
          - name: id
            value: "294f81a20003c3d00880e9e03950f6b5dba6af8cd50da891a124b8819f011e81"
        result:
          name: htlcInfo
          value: null

  - name: embedded.htlc.getProxyUnlockStatus
    summary: Reports whether an address permits proxy unlocking of HTLCs hash-locked to it.
    description: >-
      Reports whether address allows proxy unlocking, read from htlc
      contract state at the frontier momentum. When true, any address that
      knows the preimage may unlock an HTLC hash-locked to address (the
      funds still go to the hash-locked address); when false, only address
      itself may unlock. The flag is toggled per address through the
      contract's AllowProxyUnlock and DenyProxyUnlock methods; neither
      deletes the stored flag, and an address that has never called either
      defaults to true (the missing entry is treated as allowed), so the
      method never errors for an unset address.
    params:
      - name: address
        required: true
        schema:
          $ref: "#/components/schemas/Address"
        description: Address whose proxy-unlock preference to query.
    result:
      name: proxyUnlockStatus
      schema:
        type: boolean
      description: >-
        True when proxy unlocking is permitted for HTLCs hash-locked to
        the address (the default), false when only the address itself may
        unlock.
    examples:
      - name: getProxyUnlockStatusDefault
        description: >-
          An address that has never toggled the flag returns the default
          true.
        params:
          - name: address
            value: "z1qp5euzy4guav4jvdk7772tyw2guunv5narnr46"
        result:
          name: proxyUnlockStatus
          value: true
