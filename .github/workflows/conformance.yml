name: Conformance

# Replays every example request in specs/openrpc.json against a live node and
# validates the response against the method's result schema. Runs when the spec
# or the test changes, weekly against the public node, and on demand.
on:
  pull_request:
    paths:
      - 'specs/**'
      - 'scripts/conformance-test.mjs'
      - '.github/workflows/conformance.yml'
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  conformance:
    name: Spec vs live node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Conformance test
        # ZENON_NODE_URL repo variable overrides the spec's default server; an
        # empty value falls back to the spec. Exit 2 means the node was
        # unreachable for every request (infrastructure, not a spec failure) —
        # treat that as a warning so node downtime does not block a PR.
        env:
          ZENON_NODE_URL: ${{ vars.ZENON_NODE_URL }}
        run: |
          node scripts/conformance-test.mjs || {
            code=$?
            if [ "$code" = "2" ]; then
              echo "::warning::node unreachable — conformance skipped this run"
              exit 0
            fi
            exit $code
          }
