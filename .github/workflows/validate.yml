name: Validate

on:
  pull_request:

jobs:
  validate:
    name: Generate + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install dependencies
        run: npm ci
      - name: Generate reference and spec
        run: npm run gen
      - name: Verify generation is clean
        run: |
          git diff --exit-code -- specs/openrpc.json static/openrpc.json || {
            echo "::error::openrpc.json artifacts are stale — run 'npm run gen' and commit the result"
            exit 1
          }
      - name: Build website
        run: npm run build
